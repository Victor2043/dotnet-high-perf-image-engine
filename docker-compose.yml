version: '3.8'
services:
  # 1. Message Broker (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Produtor Python (Lê imagens de ./input_files e envia para a fila)
  image-producer:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY scripts/requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY scripts/producer.py .
        CMD ["python", "producer.py"]
    container_name: image-producer
    environment:
      - RABBITMQ_HOST=rabbitmq
      - DURATION_SECONDS=5
      - INPUT_DIR=/app/input_files
    volumes:
      - ./input_files:/app/input_files
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 3. Processador .NET SIMD (Consumer)
  #
  # CPU/memory limits are set EXPLICITLY here on purpose: they make the
  # benchmark reproducible and comparable across machines. Whoever runs this
  # project gets the same throughput ceiling regardless of how many cores
  # their host actually has — and bumping these numbers on a beefier machine
  # (e.g. a larger AWS instance) is exactly the "give it more, get more"
  # story worth telling in a README/post, instead of an opaque number that
  # depends on whatever Docker happened to expose.
  dotnet-engine:
    build:
      context: ./HighPerfImageEngine
      dockerfile: Dockerfile
    container_name: dotnet-engine
    environment:
      - DOTNET_ENVIRONMENT=PRODUCTION
      - RABBITMQ_HOST=rabbitmq
      - OUTPUT_DIR=/app/output_files
      - MALLOC_ARENA_MAX=2
      - DOTNET_GCHeapCount=2
    volumes:
      - ./input_files:/app/input_files
      - ./output_files:/app/output_files
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Hard CPU budget for the container, in "logical cores". 2.0 here
          # roughly mirrors a small cloud instance (e.g. an AWS t3.medium's
          # 2 vCPUs) — a natural reference point for a benchmark write-up.
          cpus: "2.0"
          # Give it enough headroom that memory is never the bottleneck;
          # this workload is CPU-bound, not memory-bound, by design.
          memory: 512M
        reservations:
          cpus: "2.0"
          memory: 256M

volumes:
  rabbitmq_data: